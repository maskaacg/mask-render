name: MASK GROUP - Render Remotion (prototipo)
run-name: render-remotion ${{ inputs.encargo_id }}
# Solo se lanza a mano o desde n8n (workflow_dispatch). No publica ni sube a Drive.
on:
  workflow_dispatch:
    inputs:
      encargo_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mask-remotion-${{ inputs.encargo_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema y de Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet kokoro-onnx==0.6.1 soundfile numpy
      - name: Cache del modelo de voz Kokoro (Apache 2.0)
        uses: actions/cache@v4
        with:
          path: remotion/models
          key: kokoro-v1.0-onnx
      - name: Descargar Kokoro si no está en cache
        run: |
          mkdir -p models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s models/$f ] || curl -sSL -o models/$f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f
          done
      - name: Voz em_alex y efectos
        run: python tools/audio_assets.py --kokoro-model models/kokoro-v1.0.onnx --kokoro-voices models/voices-v1.0.bin --out public/audio
      - name: Instalar Remotion
        run: npm ci --no-audit --no-fund
      - name: Render
        run: |
          npx remotion render src/index.ts E60CincoSellosProto out/raw.mp4 \
            --browser-executable="$(which google-chrome)" --chrome-mode=chrome-for-testing \
            --codec=h264 --crf=18
      - name: Masterizado y QA técnica
        run: python tools/finalize_qa.py --entrada out/raw.mp4 --id "${{ inputs.encargo_id }}" --salida final
      - name: Retener MP4 en GitHub hasta aprobación humana
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.encargo_id }}
          path: |
            remotion/final/*.mp4
            remotion/final/*.qa.json
          if-no-files-found: error
          retention-days: 3
