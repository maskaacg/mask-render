name: MASK GROUP - Render capítulo por tramos (ENIGMA 60)
run-name: ${{ inputs.encargo_id && format('render-capitulo {0}', inputs.encargo_id) || github.event.head_commit.message }}
# Se lanza cuando n8n deja un encargo en remotion/encargos/capitulos/ de esta rama (o a mano).
# Prepara voz y props, renderiza en tramos paralelos sin audio, une, mezcla el audio,
# pasa el QA técnico y crea una versión de revisión a 480p para Telegram.
# No publica ni sube a Drive: el máster queda como artefacto hasta la aprobación humana.
on:
  push:
    branches: [feat/e60-diorama-20261114]
    paths: ['remotion/encargos/capitulos/*.json']
  workflow_dispatch:
    inputs:
      encargo_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mask-capitulo-${{ github.sha }}
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: remotion
    outputs:
      audio: ${{ steps.enc.outputs.audio }}
      id: ${{ steps.enc.outputs.id }}
      ficha_id: ${{ steps.enc.outputs.ficha_id }}
      composicion: ${{ steps.enc.outputs.composicion }}
      tramos: ${{ steps.tramos.outputs.tramos }}
      frames: ${{ steps.tramos.outputs.frames }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Identificar el encargo
        id: enc
        run: |
          ID="${{ inputs.encargo_id }}"
          if [ -n "$ID" ]; then F="encargos/capitulos/$ID.json"; else F=$(git diff --name-only HEAD~1 HEAD -- encargos/capitulos | head -1); F="${F#remotion/}"; fi
          [ -f "$F" ] || { echo "Encargo no encontrado: $F"; exit 1; }
          python3 - "$F" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, re, sys
          e = json.load(open(sys.argv[1]))
          assert re.fullmatch(r'[A-Za-z0-9._-]{4,80}', e['encargo_id']), 'ID no válido'
          assert e.get('composicion') in ('E60Capitulo', 'E60EscapeRoom', 'E60AvanceTorre'), 'Composición no permitida'
          assert re.fullmatch(r'fichas/[A-Za-z0-9._-]+\.json', e['ficha']), 'Ficha no válida'
          f = json.load(open(e['ficha']))
          print(f"id={e['encargo_id']}")
          print(f"ficha={e['ficha']}")
          print(f"ficha_id={f['id']}")
          print(f"composicion={e['composicion']}")
          print(f"audio={e['composicion']}Audio")
          import os
          lista = os.path.isfile(f"voz_lista/{f['id']}/props.json")
          print("motor=" + ("lista" if lista else f.get('motor_voz', 'kokoro')))
          print(f"n_tramos={int(e.get('tramos', 8))}")
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet soundfile numpy
      - name: Voz pregenerada en la rama (sin coste de Actions)
        if: steps.enc.outputs.motor == 'lista'
        run: python tools/voz_lista.py restaurar --ficha "${{ steps.enc.outputs.ficha }}"
      - name: ¿Faltan líneas de voz? (texto cambiado en una corrección)
        id: faltan
        if: steps.enc.outputs.motor == 'lista'
        run: |
          python - "${{ steps.enc.outputs.ficha }}" <<'PY'
          import json, os, sys
          f = json.load(open(sys.argv[1], encoding="utf-8"))
          falta = [l["id"] for l in f["lineas"] if not os.path.exists(f"public/audio/{f['id']}/{l['id']}.wav")]
          print("Líneas sin voz:", falta)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"faltan={'true' if falta else 'false'}\n")
          PY
      - name: Cache del modelo de voz Kokoro (Apache 2.0)
        if: steps.enc.outputs.motor == 'kokoro'
        uses: actions/cache@v4
        with:
          path: remotion/models
          key: kokoro-v1.0-onnx
      - name: Voz Kokoro
        if: steps.enc.outputs.motor == 'kokoro'
        run: |
          python -m pip install --quiet kokoro-onnx==0.6.1
          mkdir -p models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s models/$f ] || curl -sSL -o models/$f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f
          done
          python tools/ficha_audio.py --ficha "${{ steps.enc.outputs.ficha }}" --kokoro-model models/kokoro-v1.0.onnx --kokoro-voices models/voices-v1.0.bin
      - name: Cache de modelos Chatterbox y Whisper
        if: steps.enc.outputs.motor == 'chatterbox' || steps.faltan.outputs.faltan == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-mtl-whisper-small
      - name: Voz expresiva Chatterbox (MIT) con control Whisper
        if: steps.enc.outputs.motor == 'chatterbox' || steps.faltan.outputs.faltan == 'true'
        run: |
          python -m pip install --quiet --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts faster-whisper num2words scipy
          python tools/voz_chatterbox.py --ficha "${{ steps.enc.outputs.ficha }}" --hilos 4 --reanudar
      - name: Instalar Remotion
        run: npm ci --no-audit --no-fund
      - name: Calcular tramos
        id: tramos
        run: |
          PROPS="out/props_${{ steps.enc.outputs.ficha_id }}.json"
          N=$(npx remotion compositions src/index.ts --props="$PROPS" --browser-executable="$(which google-chrome)" --chrome-mode=chrome-for-testing 2>/dev/null | awk -v c="${{ steps.enc.outputs.composicion }}" '$1==c{print $4}')
          echo "Fotogramas: $N"
          [ -n "$N" ] || exit 1
          python3 - "$N" "${{ steps.enc.outputs.n_tramos }}" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          n, k = int(sys.argv[1]), int(sys.argv[2])
          paso = -(-n // k)
          tr = [{"i": i, "desde": i * paso, "hasta": min(n, (i + 1) * paso) - 1} for i in range(k) if i * paso < n]
          print(f"frames={n}")
          print("tramos=" + json.dumps(tr))
          EOF
      - name: Guardar insumos (voz, efectos, props)
        uses: actions/upload-artifact@v4
        with:
          name: insumos-${{ steps.enc.outputs.id }}
          path: |
            remotion/public/audio/${{ steps.enc.outputs.ficha_id }}
            remotion/public/audio/sfx
            remotion/out/props_${{ steps.enc.outputs.ficha_id }}.json
          retention-days: 1

  tramo:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        tramo: ${{ fromJSON(needs.preparar.outputs.tramos) }}
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Instalar Remotion
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: insumos-${{ needs.preparar.outputs.id }}
          path: remotion
      - name: Render del tramo ${{ matrix.tramo.i }} (fotogramas ${{ matrix.tramo.desde }}-${{ matrix.tramo.hasta }})
        run: |
          npx remotion render src/index.ts ${{ needs.preparar.outputs.composicion }} out/tramo_$(printf '%02d' ${{ matrix.tramo.i }}).mp4 \
            --props=out/props_${{ needs.preparar.outputs.ficha_id }}.json \
            --frames=${{ matrix.tramo.desde }}-${{ matrix.tramo.hasta }} --muted \
            --browser-executable="$(which google-chrome)" --chrome-mode=chrome-for-testing \
            --codec=h264 --crf=20 --gl=swangle
      - uses: actions/upload-artifact@v4
        with:
          name: tramo-${{ needs.preparar.outputs.id }}-${{ matrix.tramo.i }}
          path: remotion/out/tramo_*.mp4
          retention-days: 1

  unir:
    needs: [preparar, tramo]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: remotion
    env:
      ID: ${{ needs.preparar.outputs.id }}
      FID: ${{ needs.preparar.outputs.ficha_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: insumos-${{ needs.preparar.outputs.id }}
          path: remotion
      - uses: actions/download-artifact@v4
        with:
          pattern: tramo-${{ needs.preparar.outputs.id }}-*
          path: remotion/out/tramos
          merge-multiple: true
      - name: Audio completo
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npx remotion render src/index.ts ${{ needs.preparar.outputs.audio }} out/audio.wav --props=out/props_$FID.json --codec=wav \
            --browser-executable="$(which google-chrome)" --chrome-mode=chrome-for-testing
      - name: Unir tramos y mezclar audio
        run: |
          ls out/tramos/tramo_*.mp4 | sort | sed "s|^out/tramos/|file '|; s|$|'|" > out/tramos/lista.txt
          cat out/tramos/lista.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i out/tramos/lista.txt -c copy out/video.mp4
          ffmpeg -hide_banner -loglevel error -y -i out/video.mp4 -i out/audio.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest out/raw.mp4
      - name: Masterizado y QA técnica
        run: python tools/finalize_qa.py --entrada out/raw.mp4 --id "$ID" --salida final --fps 24
      - name: Versión de revisión 480p (< 50 MB para Telegram)
        run: |
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 final/$ID.mp4)
          VB=$(python3 -c "d=float('$DUR'); print(max(200, int(40*8*1024/d - 96)))")
          ffmpeg -hide_banner -loglevel error -y -i final/$ID.mp4 -vf "scale='if(gt(iw,ih),854,480)':-2" -c:v libx264 -preset veryfast -b:v ${VB}k -maxrate $((VB*12/10))k -bufsize $((VB*2))k -c:a aac -b:a 96k -movflags +faststart final/$ID-revision.mp4
          ls -la final
      - name: Hoja de contactos para la QA visual (un fotograma cada 4 s)
        run: |
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 final/$ID.mp4 | head -1 | tr -dc 0-9)
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 final/$ID.mp4 | head -1 | tr -dc 0-9)
          if [ "$W" -gt "$H" ]; then T="scale=480:270,tile=6x8"; else T="scale=180:320,tile=12x3"; fi
          ffmpeg -hide_banner -loglevel error -y -i final/$ID.mp4 -vf "fps=1/4,$T" -q:v 4 final/$ID-hoja-%02d.jpg
          ls final/*hoja*
      - name: Retener máster hasta aprobación humana
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.preparar.outputs.id }}
          path: |
            remotion/final/${{ needs.preparar.outputs.id }}.mp4
            remotion/final/${{ needs.preparar.outputs.id }}.qa.json
          if-no-files-found: error
          retention-days: 3
      - name: Versión de revisión
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.preparar.outputs.id }}-revision
          path: |
            remotion/final/${{ needs.preparar.outputs.id }}-revision.mp4
            remotion/final/${{ needs.preparar.outputs.id }}.qa.json
            remotion/final/${{ needs.preparar.outputs.id }}-hoja-*.jpg
          if-no-files-found: error
          retention-days: 3
