name: MASK GROUP - Render Remotion (prototipo)
run-name: ${{ inputs.encargo_id && format('render-remotion {0}', inputs.encargo_id) || github.event.head_commit.message }}
# Se lanza cuando n8n deja un encargo en remotion/encargos/ de esta rama (o a mano).
# No publica ni sube a Drive.
on:
  push:
    branches: [feat/remotion-motor-20261114, feat/e60-diorama-20261114]
    paths: ['remotion/encargos/*.json']
  workflow_dispatch:
    inputs:
      encargo_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mask-remotion-${{ github.sha }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Identificar el encargo
        run: |
          ID="${{ inputs.encargo_id }}"
          if [ -z "$ID" ]; then
            F=$(git diff --name-only HEAD~1 HEAD -- encargos | head -1)
            ID=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['encargo_id'])" "${F#remotion/}")
          fi
          echo "$ID" | grep -Eq '^[A-Za-z0-9._-]{4,80}$' || { echo "ID no válido"; exit 1; }
          echo "ENCARGO_ID=$ID" >> "$GITHUB_ENV"
          COMP=E60CincoSellosProto; FICHA=""
          if [ -n "${F:-}" ]; then
            COMP=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('composicion','E60CincoSellosProto'))" "${F#remotion/}")
            FICHA=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('ficha',''))" "${F#remotion/}")
          fi
          case "$COMP" in E60CincoSellosProto|E60Corto|E60CortoPlano|E60Historia|E60Diorama) ;; *) echo "Composición no permitida: $COMP"; exit 1;; esac
          if [ -n "$FICHA" ]; then echo "$FICHA" | grep -Eq '^fichas/[A-Za-z0-9._-]+\.json$' && [ -f "$FICHA" ] || { echo "Ficha no válida: $FICHA"; exit 1; }; fi
          echo "COMPOSICION=$COMP" >> "$GITHUB_ENV"
          echo "FICHA=$FICHA" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias del sistema y de Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet kokoro-onnx==0.6.1 soundfile numpy
      - name: Cache del modelo de voz Kokoro (Apache 2.0)
        uses: actions/cache@v4
        with:
          path: remotion/models
          key: kokoro-v1.0-onnx
      - name: Descargar Kokoro si no está en cache
        run: |
          mkdir -p models
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -s models/$f ] || curl -sSL -o models/$f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f
          done
      - name: Voz em_alex y efectos
        run: |
          python tools/audio_assets.py --kokoro-model models/kokoro-v1.0.onnx --kokoro-voices models/voices-v1.0.bin --out public/audio
          if [ -n "$FICHA" ]; then
            python tools/ficha_audio.py --ficha "$FICHA" --kokoro-model models/kokoro-v1.0.onnx --kokoro-voices models/voices-v1.0.bin
          fi
      - name: Cache de modelos Chatterbox y Whisper
        if: env.FICHA != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-mtl-whisper-small
      - name: Voz expresiva Chatterbox (MIT) si la ficha la pide
        if: env.FICHA != ''
        run: |
          MOTOR=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('motor_voz','kokoro'))" "$FICHA")
          if [ "$MOTOR" = "chatterbox" ]; then
            rm -rf "public/audio/$(basename "$FICHA" .json)"
            python -m pip install --quiet --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts faster-whisper num2words scipy "setuptools<81"
          python -c "from perth.perth_net.perth_net_implicit.perth_watermarker import PerthImplicitWatermarker; print('marca de agua de voz OK')"
            python tools/voz_chatterbox.py --ficha "$FICHA" --hilos 4
          fi
      - name: Instalar Remotion
        run: npm ci --no-audit --no-fund
      - name: Render
        run: |
          PROPS=""
          if [ -n "$FICHA" ]; then PROPS="--props=out/props_$(basename "$FICHA" .json).json"; fi
          npx remotion render src/index.ts "$COMPOSICION" out/raw.mp4 $PROPS \
            --browser-executable="$(which google-chrome)" --chrome-mode=chrome-for-testing \
            --codec=h264 --crf=20 --gl=swangle
      - name: Masterizado y QA técnica
        run: python tools/finalize_qa.py --entrada out/raw.mp4 --id "$ENCARGO_ID" --salida final
      - name: Copia de revisión para Telegram y hoja de fotogramas
        run: |
          ID="$ENCARGO_ID"
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 final/$ID.mp4)
          VB=$(python3 -c "print(max(300, min(2500, int(40*8*1000/float('$DUR')) - 128)))")
          ffmpeg -hide_banner -loglevel error -y -i final/$ID.mp4 -vf "scale='if(gt(iw,ih),854,480)':-2" -c:v libx264 -preset veryfast -b:v ${VB}k -maxrate $((VB*12/10))k -bufsize $((VB*2))k -c:a aac -b:a 96k -movflags +faststart final/$ID-revision.mp4
          ffmpeg -hide_banner -loglevel error -y -i final/$ID.mp4 -vf "fps=1/4,scale=270:-2,tile=6x3" -frames:v 1 -q:v 4 final/$ID-hoja-01.jpg || true
      - name: Versión de revisión
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ENCARGO_ID }}-revision
          path: |
            remotion/final/${{ env.ENCARGO_ID }}-revision.mp4
            remotion/final/${{ env.ENCARGO_ID }}.qa.json
            remotion/final/${{ env.ENCARGO_ID }}-hoja-*.jpg
          if-no-files-found: error
          retention-days: 3
      - name: Máster directo (sin zip)
        uses: actions/upload-artifact@v7
        with:
          path: remotion/final/${{ env.ENCARGO_ID }}.mp4
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: QA directo (sin zip)
        uses: actions/upload-artifact@v7
        with:
          path: remotion/final/${{ env.ENCARGO_ID }}.qa.json
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Retener MP4 en GitHub hasta aprobación humana
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ENCARGO_ID }}
          path: |
            remotion/final/*.mp4
            remotion/final/*.qa.json
          if-no-files-found: error
          retention-days: 3
