name: MASK GROUP - Instalar 25 skills externas (MANUAL)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mask-skills-install
  cancel-in-progress: false
jobs:
  install-vetted-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Obtener instrucciones de commits fijados
        run: bash cloud/scripts/stage_third_party_skills.sh
      - name: Validar y guardar 25 SKILL.md, sin duplicados
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$RUNNER_TEMP/mask-skills-third-party/out"
          test "$(find "$src/.claude/skills" -type f -name SKILL.md | wc -l)" = 25
          test "$(find "$src/.agents/skills" -type f -name SKILL.md | wc -l)" = 25
          for d in "$src"/.claude/skills/* "$src"/.agents/skills/*; do
            test -d "$d" && test ! -L "$d" || exit 34
            name="$(basename "$d")"
            case "$name" in yt-*|remotion-*|find-skills) ;; *) exit 36 ;; esac
            test -f "$d/SKILL.md" || exit 37
            target="${d#"$src/"}"
            mkdir -p "$target"
            cp "$d/SKILL.md" "$target/SKILL.md"
          done
          mkdir -p cloud
          cp "$src/SKILL_HASHES.txt" cloud/THIRD_PARTY_SKILLS_SHA256.txt
          echo '25 skills markdown verificadas; no se ejecutaron scripts externos.' > cloud/THIRD_PARTY_INSTALL_RESULT.txt
          git config user.name 'MASK GROUP Skills Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .claude/skills .agents/skills cloud/THIRD_PARTY_SKILLS_SHA256.txt cloud/THIRD_PARTY_INSTALL_RESULT.txt
          git diff --cached --quiet && { echo 'Sin cambios'; exit 0; }
          git commit -m 'chore(skills): sincronizar 25 skills externas sin duplicarlas'
          git push origin HEAD:main
      - name: Evidencia de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mask-group-skills-install-evidence
          path: cloud/THIRD_PARTY_*
          retention-days: 7
